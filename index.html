<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わり算ひっ算 たんけんマップ｜にがてを さがしに いこう</title>
<style>
/* ============================================================
   わり算ひっ算 たんけんマップ
   デザイン：算数ノート（方眼＋朱色のマージン線）＋ 赤ペンの○つけ
   ============================================================ */
:root{
  --ink:#1f2a44;          /* ふでペン青 */
  --ink-60:rgba(31,42,68,.60);
  --ink-35:rgba(31,42,68,.35);
  --ink-12:rgba(31,42,68,.12);
  --paper:#fbfcfa;        /* 方眼ノートの白 */
  --grid:rgba(31,42,68,.055);
  --shu:#e5484d;          /* 朱色：まるつけ・マージン線 */
  --mizu:#2f9e8f;         /* あおみどり：せいかい */
  --yamabuki:#f2b230;     /* 星・えんぴつ */
  --fuji:#6f5cd0;         /* ボス */
  --font-ui:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
  --font-num:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono","Courier New",monospace;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-ui);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px,22px 22px;
  font-size:17px;
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99}

/* ---------- ノートのページ ---------- */
.nb{
  position:relative;
  max-width:760px;
  margin:0 auto;
  min-height:100vh;
  padding:0 clamp(14px,4vw,30px) 60px clamp(46px,10vw,64px);
}
.nb::before{ /* 朱色のマージン線 */
  content:"";position:absolute;left:clamp(22px,5.5vw,34px);top:0;bottom:0;width:2px;
  background:rgba(229,72,77,.30);
}

/* ---------- ヘッダー（HUD） ---------- */
.hud{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:12px 0 10px;
  background:linear-gradient(var(--paper) 78%,rgba(251,252,250,0));
  backdrop-filter:blur(2px);
}
.hud-t{flex:1;min-width:0}
.hud-title{
  font-size:.82rem;font-weight:800;letter-spacing:.02em;color:var(--ink-60);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bar{height:9px;border-radius:9px;background:var(--ink-12);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--mizu);transition:width .45s cubic-bezier(.3,1.4,.5,1)}
.hud-r{display:flex;align-items:center;gap:6px;flex:none}
.pill{
  font-family:var(--font-num);font-weight:700;font-size:.82rem;
  background:#fff;border:2px solid var(--ink);border-radius:999px;
  padding:3px 10px;white-space:nowrap;
  box-shadow:0 2px 0 var(--ink-12);
}
.mini{
  width:38px;height:38px;border-radius:12px;border:2px solid var(--ink);background:#fff;
  font-size:1rem;cursor:pointer;line-height:1;box-shadow:0 2px 0 var(--ink-12);
  display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink);
}
.mini:active{transform:translateY(2px);box-shadow:none}
.mini.off{opacity:.38}

/* ---------- カード ---------- */
.card{
  background:#fff;border:2.5px solid var(--ink);border-radius:var(--r);
  padding:18px 18px 20px;margin:0 0 16px;
  box-shadow:0 5px 0 var(--ink-12);
  animation:rise .34s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card.accent{border-left:11px solid var(--yamabuki)}
h1{font-size:clamp(1.42rem,5.6vw,1.85rem);line-height:1.45;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:clamp(1.16rem,4.4vw,1.4rem);line-height:1.5;margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:1rem;margin:0 0 6px;color:var(--ink-60);letter-spacing:.02em}
p{margin:0 0 12px}
.lead{font-size:1.02rem}
.sub{color:var(--ink-60);font-size:.9rem;margin:0}
.eyebrow{
  display:inline-block;font-family:var(--font-num);font-size:.72rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--ink);
  padding:3px 10px;border-radius:6px;margin-bottom:10px;
}
.eyebrow.shu{background:var(--shu)}
.eyebrow.mizu{background:var(--mizu)}
.eyebrow.fuji{background:var(--fuji)}

/* ---------- ボタン ---------- */
.btn{
  display:block;width:100%;border:2.5px solid var(--ink);border-radius:16px;
  background:#fff;color:var(--ink);font-family:var(--font-ui);font-weight:800;
  font-size:1.06rem;padding:15px 18px;cursor:pointer;text-align:center;line-height:1.5;
  box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s;
  position:relative;
}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--ink);color:#fff;box-shadow:0 5px 0 rgba(31,42,68,.45)}
.btn.gogo{background:var(--mizu);color:#fff;border-color:#1f6f65;box-shadow:0 5px 0 #1f6f65}
.btn.boss{background:var(--fuji);color:#fff;border-color:#4a3a9c;box-shadow:0 5px 0 #4a3a9c}
.btn.ghost{background:transparent;border-style:dashed;box-shadow:none;font-weight:700}
.btn.sm{font-size:.92rem;padding:11px 14px;border-radius:13px;box-shadow:0 4px 0 var(--ink)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px;width:auto}

/* ---------- 選択肢 ---------- */
.choices{display:grid;gap:11px;margin-top:14px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.four{grid-template-columns:1fr 1fr}
.choice{
  position:relative;border:2.5px solid var(--ink);border-radius:16px;background:#fff;
  padding:16px 14px;font-size:1.12rem;font-weight:800;cursor:pointer;text-align:center;
  font-family:var(--font-num);box-shadow:0 5px 0 var(--ink-12);color:var(--ink);
  transition:transform .1s,box-shadow .1s;line-height:1.4;
}
.choice.wide{font-family:var(--font-ui);font-size:1rem;text-align:left;padding-left:20px}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink-12)}
.choice.dim{opacity:.34;pointer-events:none}
.choice.bad{border-color:var(--shu);background:rgba(229,72,77,.07);animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}

/* 赤ペンの○ */
.maru{position:absolute;inset:-8px -6px;pointer-events:none;overflow:visible}
.maru path{
  fill:none;stroke:var(--shu);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:420;stroke-dashoffset:420;animation:draw .52s .04s ease-out forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- 筆算図 ---------- */
.hs-wrap{display:flex;justify-content:center;margin:14px 0 6px}
.hissan{
  display:inline-grid;
  grid-template-columns:minmax(2.5em,auto) repeat(var(--n),1.65em);
  font-family:var(--font-num);font-size:clamp(1.35rem,5.4vw,1.65rem);line-height:1;
  background:#fff;padding:10px 14px 10px 6px;border-radius:12px;
}
.hissan .c{min-height:1.7em;display:flex;align-items:center;justify-content:center;padding:0 .05em;border-radius:5px}
.hissan .c.top{border-top:2.5px solid var(--ink);border-radius:0}
.hissan .c.left{border-left:2.5px solid var(--ink);border-radius:0}
.hissan .c.u{border-bottom:2px solid var(--ink-35);border-radius:0}
.hissan .c.div{justify-content:flex-end;padding-right:.32em;font-size:.95em}
.hissan .c.hl{background:rgba(242,178,48,.42);box-shadow:0 0 0 2px rgba(242,178,48,.42)}
.hissan .c.shu{color:var(--shu);font-weight:700}
.hissan .c.mizu{color:var(--mizu);font-weight:700}
.hissan .c.fade{color:var(--ink-35)}
.hs-cap{text-align:center;font-size:.85rem;color:var(--ink-60);margin:0 0 4px}

.figbox{border:2px dashed var(--ink-35);border-radius:16px;padding:12px;margin:14px 0;background:rgba(255,255,255,.6)}
.figbox .ttl{font-size:.82rem;font-weight:800;color:var(--ink-60);margin:0 0 6px;letter-spacing:.04em}

/* 手順の帯 */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;justify-content:center}
.step{
  font-family:var(--font-num);font-size:.9rem;font-weight:700;
  border:2px solid var(--ink);border-radius:11px;padding:7px 12px;background:#fff;
  box-shadow:0 3px 0 var(--ink-12);
}
.step.on{background:var(--yamabuki);box-shadow:0 3px 0 #c58f18}
.step+.step::before{content:"";}

/* 3つの場所（上・中・下） */
.zones{display:grid;gap:8px;margin:12px 0}
.zone{display:flex;align-items:center;gap:10px;font-size:.95rem}
.zone b{font-family:var(--font-num);border:2px solid var(--ink);border-radius:8px;padding:2px 9px;font-size:.82rem;background:#fff;flex:none}

/* ---------- フィードバック ---------- */
.fb{border-radius:16px;padding:14px 16px;margin-top:14px;border:2.5px solid;animation:rise .26s both}
.fb.ok{border-color:var(--mizu);background:rgba(47,158,143,.08)}
.fb.ng{border-color:var(--shu);background:rgba(229,72,77,.07)}
.fb.tip{border-color:var(--yamabuki);background:rgba(242,178,48,.10)}
.fb .h{font-weight:800;font-size:1.05rem;margin:0 0 5px;display:flex;align-items:center;gap:8px}
.fb p:last-child{margin-bottom:0}
.fb.ok .h{color:#1f6f65}
.fb.ng .h{color:#b33136}
.fb.tip .h{color:#9a6a08}

/* ---------- えんぴつ君 ---------- */
.coach{display:flex;gap:12px;align-items:flex-start;margin:0 0 4px}
.coach .px{flex:none;width:52px;filter:drop-shadow(0 3px 0 var(--ink-12))}
.coach .bub{
  flex:1;background:#fff;border:2.5px solid var(--ink);border-radius:16px;
  padding:11px 14px;position:relative;font-size:.98rem;box-shadow:0 4px 0 var(--ink-12);
}
.coach .bub::before{
  content:"";position:absolute;left:-9px;top:16px;width:14px;height:14px;background:#fff;
  border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg);
}
.coach .bub p:last-child{margin-bottom:0}
.coach.sm .px{width:40px}

/* ---------- ステージ一覧 ---------- */
.map{position:relative;padding-left:8px}
.st{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  border:2.5px solid var(--ink);border-radius:16px;background:#fff;
  padding:13px 14px;margin-bottom:11px;cursor:pointer;font-family:var(--font-ui);
  box-shadow:0 5px 0 var(--ink-12);position:relative;
  transition:transform .1s,box-shadow .1s;
}
.st:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink-12)}
.st .no{
  flex:none;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-num);
  font-weight:700;font-size:1.05rem;background:var(--yamabuki);color:var(--ink);
}
.st.done .no{background:var(--mizu);color:#fff;border-color:#1f6f65}
.st .tx{flex:1;min-width:0}
.st .tx b{display:block;font-size:1.03rem;line-height:1.4}
.st .tx span{font-size:.82rem;color:var(--ink-60);display:block;line-height:1.5}
.st .go{flex:none;font-size:1.1rem;color:var(--ink-35)}
.st:hover{border-color:var(--mizu)}

/* ---------- 結果 ---------- */
.judge{
  border:3px solid var(--shu);border-radius:18px;padding:16px;text-align:center;
  background:rgba(229,72,77,.05);margin:6px 0 14px;
}
.judge .big{font-size:1.5rem;font-weight:800;color:var(--shu);line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tag{border:2px solid var(--ink);border-radius:999px;padding:5px 13px;font-size:.88rem;font-weight:700;background:#fff}
.tag.hit{background:var(--shu);color:#fff;border-color:#b33136}
.tag.free{background:var(--mizu);color:#fff;border-color:#1f6f65}

/* ---------- おとなの人へ ---------- */
details.adult{margin-top:26px;border-top:2px dashed var(--ink-35);padding-top:16px}
details.adult summary{
  cursor:pointer;font-weight:800;color:var(--ink-60);font-size:.9rem;
  list-style:none;padding:6px 0;
}
details.adult summary::-webkit-details-marker{display:none}
details.adult summary::before{content:"▸ ";color:var(--shu)}
details.adult[open] summary::before{content:"▾ "}
.adult-body{font-size:.88rem;line-height:1.85;color:var(--ink-60)}
.adult-body h4{margin:14px 0 4px;color:var(--ink);font-size:.92rem}
.adult-body ul{margin:4px 0 10px;padding-left:20px}
.adult-body li{margin-bottom:4px}
.adult-body a{color:#1f6f65}
.legend{display:grid;gap:6px;margin:10px 0}
.legend div{display:flex;gap:8px;font-size:.84rem}
.legend b{flex:none;font-family:var(--font-num)}

.foot{margin-top:6px}
.link{
  background:none;border:none;color:var(--ink-35);font-size:.78rem;cursor:pointer;
  font-family:var(--font-ui);text-decoration:underline;padding:8px 0;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--fuji);outline-offset:3px}
@media (max-width:420px){
  .choices.four{grid-template-columns:1fr 1fr}
  .hissan{font-size:1.3rem}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="nb">
  <header class="hud">
    <div class="hud-t">
      <div class="hud-title" id="hudTitle">わり算ひっ算 たんけんマップ</div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="hud-r">
      <span class="pill" id="starPill">⭐ 0</span>
      <button class="mini" id="sndBtn" title="音を けす／つける" aria-label="音の オン・オフ">🔊</button>
      <button class="mini" id="resetBtn" title="さいしょから" aria-label="さいしょから">↺</button>
    </div>
  </header>

  <main id="screen"></main>

  <footer class="foot">
    <button class="link" id="adultBtn">おとなの人へ（つかいかた・見かた）</button>
  </footer>
</div>

<script>
"use strict";
/* ============================================================
   筆算図をつくる（n = わられる数の けた数）
   rows の 1マス = "" | "文字" | {t:"文字", k:"クラス"}
   ============================================================ */
function hs(n, rows){
  var out = '<div class="hissan" style="--n:' + n + '">';
  for (var i = 0; i < rows.length; i++){
    var r = rows[i];
    for (var j = 0; j < r.length; j++){
      var c = r[j];
      if (c === '' || c === null || c === undefined){ out += '<div class="c"></div>'; continue; }
      var t = (typeof c === 'object') ? c.t : c;
      var k = (typeof c === 'object') ? (c.k || '') : '';
      var style = (typeof c === 'object' && c.s) ? ' style="' + c.s + '"' : '';
      out += '<div class="c ' + k + '"' + style + '>' + t + '</div>';
    }
  }
  return out + '</div>';
}
function fig(title, inner){
  return '<div class="figbox"><p class="ttl">' + title + '</p><div class="hs-wrap">' + inner + '</div></div>';
}
function steps(list, active){
  var h = '<div class="steps">';
  for (var i = 0; i < list.length; i++){
    h += '<span class="step' + (i === active ? ' on' : '') + '">' + list[i] + '</span>';
    if (i < list.length - 1) h += '<span class="step" style="border:none;box-shadow:none;padding:7px 0;background:none">→</span>';
  }
  return h + '</div>';
}

/* ============================================================
   ステージ・データ
   ============================================================ */
var SVG_PX = '<svg class="px" viewBox="0 0 90 140" aria-hidden="true">'
 + '<rect x="27" y="20" width="36" height="88" rx="6" fill="#f2b230"/>'
 + '<rect x="27" y="20" width="36" height="15" rx="6" fill="#e5484d"/>'
 + '<rect x="27" y="104" width="36" height="7" fill="#e0a52c"/>'
 + '<path d="M27 111 L45 138 L63 111 Z" fill="#f7e3bd"/>'
 + '<path d="M40.5 128 L45 138 L49.5 128 Z" fill="#1f2a44"/>'
 + '<g class="face">__FACE__</g></svg>';
var FACE = {
  up:  '<circle cx="38" cy="62" r="3.6" fill="#1f2a44"/><circle cx="52" cy="62" r="3.6" fill="#1f2a44"/>'
     + '<path d="M38 76 q7 8 14 0" stroke="#1f2a44" stroke-width="3.4" fill="none" stroke-linecap="round"/>'
     + '<circle cx="32" cy="74" r="3.4" fill="#e5484d" opacity=".28"/><circle cx="58" cy="74" r="3.4" fill="#e5484d" opacity=".28"/>',
  think:'<circle cx="38" cy="62" r="3.6" fill="#1f2a44"/><circle cx="52" cy="62" r="3.6" fill="#1f2a44"/>'
     + '<path d="M36 76 q9 5 18 -2" stroke="#1f2a44" stroke-width="3.4" fill="none" stroke-linecap="round"/>',
  cheer:'<path d="M34 60 q4 -6 8 0" stroke="#1f2a44" stroke-width="3.4" fill="none" stroke-linecap="round"/>'
     + '<path d="M48 60 q4 -6 8 0" stroke="#1f2a44" stroke-width="3.4" fill="none" stroke-linecap="round"/>'
     + '<path d="M36 74 q9 11 18 0" stroke="#1f2a44" stroke-width="3.4" fill="none" stroke-linecap="round"/>'
     + '<circle cx="30" cy="73" r="3.6" fill="#e5484d" opacity=".3"/><circle cx="60" cy="73" r="3.6" fill="#e5484d" opacity=".3"/>'
};
function pencil(mood){
  return SVG_PX.replace('__FACE__', FACE[mood || 'up']);
}
function bub(html, mood, small){
  return '<div class="coach' + (small ? ' sm' : '') + '">' + pencil(mood)
       + '<div class="bub">' + html + '</div></div>';
}

var STAGES = [

/* ---------- 1 ---------- */
{
  id:'s1', no:'1', title:'九九の ぎゃくひき', short:'「この数は どの だん？」',
  intro:
    '<p>わり算は、<b>九九の ぎゃくもん</b>です。</p>'
  + '<p class="lead">「<b>3の だんで 21に なるのは いくつ？</b>」<br>→ 3×7＝21 だから <b>7</b>。<br>これが わり算の こたえ（商）を 見つける やりかたです。</p>'
  + '<p>ここで つまずくと、あとの ぜんぶが おそく なります。<b>まず ここだけ</b> チェック。</p>',
  fig: fig('2けた × 1けた の 暗算も ここで きたえる',
      '<div style="font-family:var(--font-num);font-size:1.15rem;line-height:2.1;text-align:left">'
    + '3 × <b style="color:var(--shu)">7</b> ＝ 21　→　21 は「3の だん」<br>'
    + '7 × <b style="color:var(--shu)">8</b> ＝ 56　→　56 は「7の だん」<br>'
    + '32 × 7 ＝ 224　（くりあがりは 小さく メモ）</div>'),
  quiz:[
    { q:'4の だんで <b>32</b> に なるのは いくつ？', ch:['6','7','8','9'], a:2, cols:4,
      ng:'おしい！ 4×6＝24、4×7＝28… もう すこし 大きいよ。',
      ok:'ばっちり！ 4×8＝32 だね。',
      hint:'4のだんを じゅんに 言ってみよう：4,8,12,16,20,24,28,<b>32</b>。' },
    { q:'7の だんで <b>56</b> に なるのは いくつ？', ch:['6','7','8','9'], a:2, cols:4,
      ng:'ちがうよ。7×7＝49、7×8＝… もう いちど 言ってみよう。',
      ok:'そのとおり！ 7×8＝56。',
      hint:'7,14,21,28,35,42,49,<b>56</b>。8こめ だね。' },
    { q:'<b>21 × 3</b> は いくつ？', ch:['53','63','73','23'], a:1, cols:4,
      ng:'かけ算の じゅんばんは 右から！ 1×3＝3、2×3＝6。',
      ok:'そう！ 21×3＝63。',
      hint:'一の位から：1×3＝3 → 十の位：2×3＝6 → こたえ 63。' },
    { q:'<b>32 × 7</b> は いくつ？', ch:['194','214','224','234'], a:2, cols:4,

/* ============================================================

function el(id){ return document.getElementById(id); }

/* ---------- 音 ---------- */
var AC = null, soundOn = true;
function actx(){
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; }
  return AC;
}
function note(freq, start, dur, vol, type){
  var a = actx(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  o.connect(g); g.connect(a.destination);
  var t = a.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}
function sfx(kind){
  if (!soundOn) return;
  var a = actx(); if (!a) return;
  if (a.state === 'suspended'){ try{ a.resume(); }catch(e){} }
  if (kind === 'ok'){ note(784,0,.14,.13); note(1175,.09,.24,.11); }
  else if (kind === 'ng'){ note(233,0,.16,.09,'triangle'); note(196,.10,.24,.08,'triangle'); }
  else if (kind === 'tap'){ note(523,0,.07,.06,'square'); }
  else if (kind === 'clear'){ note(523,0,.30,.12); note(659,.11,.30,.12); note(784,.22,.30,.12); note(1047,.33,.42,.13); }
}

/* ---------- 紙ふぶき ---------- */
var fx = el('fx'), fxc = fx.getContext('2d'), parts = [], running = false;
function sizeFx(){
  var dpr = window.devicePixelRatio || 1;
  fx.width = window.innerWidth * dpr; fx.height = window.innerHeight * dpr;
  fxc.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function confetti(n){
  sizeFx();
  var cols = ['#e5484d','#f2b230','#2f9e8f','#6f5cd0','#1f2a44'];
  for (var i = 0; i < n; i++){
    parts.push({
      x: window.innerWidth * (0.12 + Math.random() * 0.76),
      y: -20 - Math.random() * 160,
      vx: (Math.random() - 0.5) * 2.8,
      vy: 2.0 + Math.random() * 3.2,
      r: 5 + Math.random() * 7,
      c: cols[i % cols.length],
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
      sq: Math.random() < 0.55
    });
  }
  if (!running){ running = true; requestAnimationFrame(tickFx); }
}
function tickFx(){
  fxc.clearRect(0, 0, window.innerWidth, window.innerHeight);
  for (var i = parts.length - 1; i >= 0; i--){
    var p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vr;
    if (p.y > window.innerHeight + 40){ parts.splice(i, 1); continue; }
    fxc.save(); fxc.translate(p.x, p.y); fxc.rotate(p.rot); fxc.fillStyle = p.c;
    if (p.sq) fxc.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.62);
    else { fxc.beginPath(); fxc.arc(0, 0, p.r / 2, 0, 6.2832); fxc.fill(); }
    fxc.restore();
  }
  if (parts.length) requestAnimationFrame(tickFx);
  else { running = false; fxc.clearRect(0, 0, window.innerWidth, window.innerHeight); }
}

/* ---------- よみあげ ---------- */
function speak(text){
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.92; u.pitch = 1.05;
    var vs = window.speechSynthesis.getVoices() || [];
    for (var i = 0; i < vs.length; i++){ if (vs[i].lang && vs[i].lang.indexOf('ja') === 0){ u.voice = vs[i]; break; } }
    window.speechSynthesis.speak(u);
  } catch(e){}
}
function stripTags(s){ return String(s).replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' '); }

/* ---------- 状態 ---------- */
var KEY = 'warizan-tanken-v1';
var S = { stage:0, qi:0, tries:0, locked:false, done:{}, wrong:{}, answered:0, firstTry:0 };
var TOTAL_Q = STAGES.reduce(function(a, s){ return a + s.quiz.length; }, 0);
var N_STAGE = STAGES.length;

function save(){
  try { localStorage.setItem(KEY, JSON.stringify({ done:S.done, wrong:S.wrong, answered:S.answered, firstTry:S.firstTry })); } catch(e){}
}
function load(){
  try {
    var d = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (d && typeof d === 'object'){
      S.done = d.done || {}; S.wrong = d.wrong || {};
      S.answered = d.answered || 0; S.firstTry = d.firstTry || 0;
    }
  } catch(e){}
}
function clearedCount(){ var n = 0; for (var k in S.done){ if (S.done[k]) n++; } return n; }

/* ---------- HUD ---------- */
function updateHUD(){
  var c = clearedCount();
  el('bar').style.width = Math.round(c / N_STAGE * 100) + '%';
  el('starPill').innerHTML = '<span style="display:inline-flex;align-items:center;gap:4px">'
    + ICON_STAR + '<span>' + c + '/' + N_STAGE + '</span></span>';
  el('sndBtn').innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;
  el('sndBtn').className = 'mini' + (soundOn ? '' : ' off');
  el('hudTitle').textContent = 'わり算 ひっ算 たんけんマップ';
}

/* ---------- 部品 ---------- */
var MARU = '<svg class="maru" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'
  + '<path d="M14 34 C18 12,74 6,86 28 C96 52,66 88,38 84 C14 80,4 52,22 30"/></svg>';

function choiceHTML(q, i){
  var cls = 'choice' + (q.wide ? ' wide' : '');
  return '<button class="' + cls + '" data-i="' + i + '" type="button">' + q.ch[i] + '</button>';
}
function dots(n, cur){
  var h = '<span style="font-family:var(--font-num);font-size:.8rem;color:var(--ink-35);letter-spacing:.18em">';
  for (var i = 0; i < n; i++) h += (i === cur ? '●' : '○');
  return h + '</span>';
}
function readBtn(text){
  if (!('speechSynthesis' in window)) return '';
  return '<button class="btn ghost sm" type="button" style="margin-top:10px" '
    + 'onclick="speak(this.dataset.t)" data-t="' + String(text).replace(/"/g, '&quot;') + '">'
    + '<span style="display:inline-flex;align-items:center;gap:6px;justify-content:center">'
    + ICON_SOUND_ON + 'よみあげる</span></button>';
}

/* ============================================================
   画面
   ============================================================ */
function render(){
  updateHUD();
  var s = el('screen');
  s.innerHTML = '';
  if (VIEW === 'home') s.innerHTML = viewHome();
  else if (VIEW === 'intro') s.innerHTML = viewIntro();
  else if (VIEW === 'quiz'){ s.innerHTML = viewQuiz(); bindQuiz(); }
  else if (VIEW === 'clear') s.innerHTML = viewClear();
  else if (VIEW === 'result') s.innerHTML = viewResult();
  else if (VIEW === 'adult') s.innerHTML = viewAdult();
  window.scrollTo(0, 0);
}

function viewHome(){
  var c = clearedCount();
  var h = '<div class="card accent">'
    + '<span class="eyebrow">たんけんマップ</span>'
    + '<h1>わり算の ひっ算、<br>どこで つまずいてる？</h1>'
    + '<p class="lead">ステージを じゅんばんに すすむと、<b>きみの「にがてな ところ」</b>が わかります。'
    + 'わからなくて あたりまえ。まちがえても すすめるから、あんしんして やってみよう。</p>'
    + '<p class="sub">ぜんぶで ' + TOTAL_Q + 'もん／' + N_STAGE + 'ステージ　1もん 1ぷん くらい</p>'
    + '</div>';

  h += '<div class="map">';
  for (var i = 0; i < STAGES.length; i++){
    var st = STAGES[i];
    var done = !!S.done[st.id];
    h += '<button class="st' + (done ? ' done' : '') + '" type="button" data-go="' + i + '">'
       + '<span class="no">' + (done ? '✓' : st.no) + '</span>'
       + '<span class="tx"><b>' + st.title + '</b><span>' + st.short + '</span></span>'
       + '<span class="go">›</span></button>';
  }
  h += '</div>';

  h += '<button class="btn ' + (c ? 'gogo' : 'primary') + '" type="button" id="startBtn">'
     + (c ? 'つづきから はじめる' : 'たんけんを はじめる') + '</button>';

  if (c >= N_STAGE){
    h += '<button class="btn ghost sm" type="button" id="resBtn" style="margin-top:12px">けっか を 見る</button>';
  }
  return h;
}

function viewIntro(){

  var txt = st.title + '。' + stripTags(st.intro);
  var h = '<div class="card accent">'
    + '<span class="eyebrow' + (st.boss ? ' fuji' : '') + '">' + (st.boss ? 'BOSS ステージ' : 'STAGE ' + st.no + ' / 7') + '</span>'
    + '<h2>' + st.title + '</h2>'

     + '<button class="btn ghost sm" type="button" id="toHome" style="margin-top:12px">マップに もどる</button>';
  return h;
}

function viewQuiz(){
  var st = STAGES[S.stage], q = st.quiz[S.qi];
  var h = '<div class="card accent">';
  h += '<span class="eyebrow' + (st.boss ? ' fuji' : '') + '">'
     + (st.boss ? 'BOSS' : 'STAGE ' + st.no) + '　' + dots(st.quiz.length, S.qi) + '</span>';
  h += '<h2>' + q.q + '</h2>';
  if (q.fig) h += q.fig;
  h += '<div class="choices' + (q.cols === 4 ? ' four' : (q.cols === 1 ? '' : ' two')) + '" id="choiceBox">';
  for (var i = 0; i < q.ch.length; i++) h += choiceHTML(q, i);
  h += '</div>';
  h += '<div id="fbSlot"></div><div id="nextSlot"></div>';
  h += '</div>';
  return h;
}

function bindQuiz(){
  var box = el('choiceBox');
  if (!box) return;
  box.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.choice') : null;
    if (!b) return;
    pick(parseInt(b.getAttribute('data-i'), 10));
  });
}

function pick(i){
  if (S.locked) return;
  var st = STAGES[S.stage], q = st.quiz[S.qi];
  var box = el('choiceBox');
  var btns = box.querySelectorAll('.choice');
  var fb = el('fbSlot');

  if (i === q.a){
    S.locked = true;
    sfx('ok');
    btns[i].insertAdjacentHTML('beforeend', MARU);
    for (var k = 0; k < btns.length; k++){ if (k !== i) btns[k].classList.add('dim'); }
    fb.innerHTML = '<div class="fb ok"><p class="h">'
      + '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 12.5l5.2 5.2L20 7" stroke="#2f9e8f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + 'せいかい！</p><p>' + q.ok + '</p></div>';
    if (S.tries === 0) S.firstTry++;
    if (S.tries > 0) S.wrong[st.id] = (S.wrong[st.id] || 0);
    S.answered++;
    save();
    finishQuestion();
  } else {
    S.tries++;
    sfx('ng');
    btns[i].classList.add('bad');
    setTimeout(function(){ btns[i].classList.add('dim'); }, 400);
    S.wrong[st.id] = (S.wrong[st.id] || 0) + 1;
    save();
    if (S.tries >= 2){
      S.locked = true;
      btns[q.a].insertAdjacentHTML('beforeend', MARU);
      for (var m = 0; m < btns.length; m++){
        if (m !== q.a) btns[m].classList.add('dim');
        else btns[m].style.opacity = '1';
      }
      btns[q.a].style.boxShadow = '0 0 0 4px rgba(47,158,143,.35), 0 5px 0 var(--ink-12)';
      fb.innerHTML = '<div class="fb tip"><p class="h">だいじょうぶ、いっしょに かくにんしよう</p>'
        + '<p>' + q.hint + '</p><p style="margin-top:8px"><b>こたえは「' + stripTags(q.ch[q.a]) + '」</b>だよ。'
        + 'なぜ そう なるか、もう いちど 読んで みよう。</p></div>';
      finishQuestion();
    } else {
      fb.innerHTML = '<div class="fb ng"><p class="h">おしい！</p><p>' + q.ng + '</p>'
        + '<p style="margin-top:6px;font-size:.92rem;color:var(--ink-60)">もう いちど えらんで みよう。</p></div>';
    }
  }
}

function finishQuestion(){
  var st = STAGES[S.stage];
  var last = (S.qi >= st.quiz.length - 1);
  var label = last ? (st.boss ? 'けっか を 見る' : 'ステージ クリアへ') : 'つぎの もんだいへ';
  el('nextSlot').innerHTML = '<button class="btn ' + (st.boss ? 'boss' : 'gogo')
    + '" type="button" id="nextQ" style="margin-top:14px">' + label + '</button>';
  el('nextQ').addEventListener('click', function(){
    sfx('tap');
    if (last){
      S.done[st.id] = true;
      if (S.qi === st.quiz.length - 1){
        S.stage = (S.stage + 1) % N_STAGE;
        S.qi = 0; S.tries = 0; S.locked = false;
      }
      save();
      if (st.boss){ const c = clearedCount(); if (c >= N_STAGE) confetti(140); sfx('clear'); VIEW = 'result'; }
      else { confetti(90); sfx('clear'); VIEW = 'clear'; }
    } else {
      S.qi++; S.tries = 0; S.locked = false;
    }
    render();
  });
}

function viewClear(){
  var st = STAGES[S.stage === 0 ? N_STAGE - 1 : S.stage - 1];
  var h = '<div class="card" style="text-align:center">'

  return h;
}

function goQuiz(){ S.qi = 0; S.tries = 0; S.locked = false; VIEW = 'quiz'; render(); }

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-go]') : null;
  if (t){ sfx('tap'); goIntro(parseInt(t.getAttribute('data-go'), 10)); return; }
  var id = e.target.closest ? e.target.closest('button') : null;
  if (!id) return;
  var bid = id.id;
  if (bid === 'startBtn'){
    sfx('tap');
    var first = -1;
    for (var i = 0; i < N_STAGE; i++){ if (!S.done[STAGES[i].id]){ first = i; break; } }
    goIntro(first < 0 ? 0 : first);
  }
  else if (bid === 'toQuiz'){ sfx('tap'); goQuiz(); }
  else if (bid === 'toHome'){ sfx('tap'); goHome(); }
  else if (bid === 'nextStage'){ sfx('tap'); goIntro(S.stage); }
  else if (bid === 'resBtn'){ sfx('tap'); VIEW = 'result'; render(); }
});

el('sndBtn').addEventListener('click', function(){
  soundOn = !soundOn; if (soundOn) sfx('tap'); updateHUD();
});
el('resetBtn').addEventListener('click', function(){
  if (!window.confirm('さいしょから やりなおしますか？（⭐ と けっかが 消えます）')) return;
  S = { stage:0, qi:0, tries:0, locked:false, done:{}, wrong:{}, answered:0, firstTry:0 };
  try { localStorage.removeItem(KEY); } catch(e){}
  parts.length = 0; VIEW = 'home'; render();
});
el('adultBtn').addEventListener('click', function(){ sfx('tap'); VIEW = 'adult'; render(); });

/* ---------- 起動 ---------- */
load();
(function init(){
  /* 絵文字を アイコンに 置きかえる */
  el('sndBtn').innerHTML = ICON_SOUND_ON;
  el('resetBtn').innerHTML = ICON_RESET;
  el('starPill').innerHTML = ICON_STAR + ' 0/' + N_STAGE;

  var hash = (location.hash || '').replace('#', '');
  if (/^s[0-9]$/.test(hash)){
    var n = parseInt(hash.slice(1), 10);
    if (n >= 0 && n < N_STAGE){ S.stage = n; VIEW = 'quiz'; }
  } else if (hash === 'intro'){ VIEW = 'intro'; }
  else if (hash === 'result'){ VIEW = 'result'; }
  else if (hash === 'adult'){ VIEW = 'adult'; }
  render();
  window.addEventListener('hashchange', function(){
    var hh = (location.hash || '').replace('#', '');
    if (/^s[0-9]$/.test(hh)){ var m = parseInt(hh.slice(1), 10); if (m < N_STAGE){ goQuiz.call(null, S.stage = m); } }
  });
})();

/* テスト用に 画面を 直接 ひらく */
window.__view = function(v, i){ if (typeof i === 'number') S.stage = i; VIEW = v; render(); };
</script>
</body>
